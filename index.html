<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瑜伽師資培訓 模擬考試</title>
    <style>
        :root {
            --primary: #4a6fa5;
            --secondary: #166088;
            --success: #2a9d8f;
            --danger: #e76f51;
            --bg: #f4f6f8;
            --card: #ffffff;
            --text: #2b2d42;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            background: var(--card);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 20px;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--bg);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        h1 { font-size: 1.4rem; color: var(--secondary); margin: 0; }
        .subtitle { font-size: 0.85rem; color: #6c757d; margin-top: 4px; }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background-color: var(--primary);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn:active { transform: scale(0.98); }
        .btn-secondary { background-color: #6c757d; }
        .btn-outline { background-color: transparent; border: 2px solid var(--primary); color: var(--primary); }

        .card { display: none; }
        .card.active { display: block; }

        .question-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 12px; }
        .question-img { width: 100%; max-height: 220px; object-fit: contain; border-radius: 8px; margin-bottom: 12px; background: #eee; }

        .option-btn {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            text-align: left;
            width: 100%;
            font-size: 0.95rem;
            cursor: pointer;
            box-sizing: border-box;
        }

        .option-btn.selected { border-color: var(--primary); background: #eef4fc; }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 12px;
            font-size: 1rem;
        }

        .result-score { text-align: center; font-size: 2.2rem; font-weight: bold; color: var(--primary); margin: 15px 0; }
        .tag { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; margin-right: 5px; color: white; }
        .tag-strong { background-color: var(--success); }
        .tag-weak { background-color: var(--danger); }

        .analysis-item { border-bottom: 1px solid #eee; padding: 10px 0; font-size: 0.9rem; }
        .progress-bar { height: 6px; background: #e9ecef; border-radius: 3px; margin-bottom: 15px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>🧘‍♀️ 瑜伽考試互動刷題網</h1>
        <div class="subtitle">RYT200 哲學 / 體位法 / 呼吸法 / 脈輪 綜合題庫</div>
    </header>

    <!-- 1. 開始主頁 -->
    <div id="home-card" class="card active">
        <p style="text-align:center;">準備好檢視你的學習成果了嗎？</p>
        <button class="btn" onclick="startQuiz()">🚀 開始隨機模擬測驗</button>
        <button class="btn btn-outline" onclick="showEditor()">✏️ 題庫管理 / 新增題目</button>
    </div>

    <!-- 2. 測驗進行區 -->
    <div id="quiz-card" class="card">
        <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>
        <div id="category-badge" style="font-size:0.8rem; color:#6c757d; margin-bottom:5px;"></div>
        <div id="question-text" class="question-title"></div>
        <img id="question-img" class="question-img" src="" style="display:none;" alt="題目圖片">
        
        <div id="options-container"></div>
        <input type="text" id="short-answer-input" placeholder="請輸入答案..." style="display:none;">

        <button id="next-btn" class="btn" onclick="nextQuestion()">下一題</button>
    </div>

    <!-- 3. 成績與分析區 -->
    <div id="result-card" class="card">
        <h2>測驗結果</h2>
        <div class="result-score" id="score-text">0 分</div>
        
        <h3>📊 強弱項分析</h3>
        <div id="analysis-tags" style="margin-bottom: 15px;"></div>

        <h3>📝 解析總覽</h3>
        <div id="review-container"></div>

        <button class="btn" onclick="startQuiz()">🔄 再測驗一次</button>
        <button class="btn btn-secondary" onclick="showHome()">🏠 回首頁</button>
    </div>

    <!-- 4. 題庫編輯區 -->
    <div id="editor-card" class="card">
        <h2>新增題目</h2>
        <select id="edit-cat">
            <option value="瑜伽哲學">瑜伽哲學</option>
            <option value="體位法">體位法</option>
            <option value="調息法">調息法</option>
            <option value="脈輪與能量">脈輪與能量</option>
        </select>
        <select id="edit-type" onchange="toggleTypeEdit()">
            <option value="single">選擇題</option>
            <option value="short">簡答題</option>
        </select>
        <textarea id="edit-q" placeholder="請輸入題目內容..."></textarea>
        <input type="text" id="edit-img" placeholder="圖片網址 (選填，如：https://.../photo.jpg)">
        
        <div id="edit-options-group">
            <input type="text" class="edit-opt" placeholder="選項 A">
            <input type="text" class="edit-opt" placeholder="選項 B">
            <input type="text" class="edit-opt" placeholder="選項 C">
            <input type="text" class="edit-opt" placeholder="選項 D">
        </div>
        
        <input type="text" id="edit-ans" placeholder="正確答案（選擇題填 A/B/C/D，簡答題填文字答案）">
        <textarea id="edit-exp" placeholder="重點解析說明..."></textarea>

        <button class="btn" onclick="saveQuestion()">💾 儲存至題庫</button>
        <button class="btn btn-secondary" onclick="showHome()">取消返回</button>
    </div>
</div>

<script>
// 初始預設題庫 (包含哲學、調息法、脈輪、體位法圖片題等範例)
let defaultQuestionBank = [
    {
        id: 1,
        category: "瑜伽哲學",
        type: "single",
        question: "數論哲學（Sankhya）中，哪一個概念代表『永恆不變、純粹意識』？",
        img: "",
        options: ["Prakriti 原質", "Purusha 靈/神我", "Mahat 智力", "Ahankara 自我"],
        answer: "B",
        explanation: "Purusha 代表永恆不變的純粹意識；Prakriti 則為物質世界的根本原質。"
    },
    {
        id: 2,
        category: "脈輪與能量",
        type: "single",
        question: "關於脈輪蓮花顏色的對應，『心輪（Anahata）』代表的蓮花顏色為何？",
        img: "",
        options: ["綠色", "黃色", "藍色", "紫色"],
        answer: "C",
        explanation: "心輪代表的蓮花顏色為藍色（元素為風/氣）；代表顏色雖為綠色，但筆記重點強調蓮花顏色為藍色。"
    },
    {
        id: 3,
        category: "調息法",
        type: "single",
        question: "下列哪一種調息法有助於降溫冷卻體溫，但『低血壓及哮喘患者』不宜練習？",
        img: "",
        options: ["Bhastrika 風箱呼吸法", "Seetkari 嘶聲呼吸法", "Bhramari 蜜蜂呼吸法", "Ujjai 勝利呼吸法"],
        answer: "B",
        explanation: "Seetkari（嘶聲呼吸法）能冷卻身體與降低血壓，因此低血壓及呼吸道過敏患者不宜練習。"
    },
    {
        id: 4,
        category: "瑜伽哲學",
        type: "short",
        question: "請寫出三性（Gunas）中，由惰性（Tamas）所分化出的『五大元素』有哪些？",
        img: "",
        options: [],
        answer: "空、風、火、水、土",
        explanation: "惰性（Tamas）分化出五感受與五大元素（空、風、火、水、土）。"
    },
    {
        id: 5,
        category: "體位法",
        type: "single",
        question: "圖中這項身印（Mudra）動作，收縮肛門括約肌稱為？",
        img: "https://images.unsplash.com/photo-1545205597-3d9d02c29597?w=500", // 預設示範圖
        options: ["Ashwini Mudra (馬身印)", "Vajroli Mudra (閃電身印)", "Khechari Mudra (鎖舌身印)", "Yoni Mudra (胎內手印)"],
        answer: "A",
        explanation: "Ashwini Mudra 為馬身印，主要動作為收縮肛門括約肌。"
    }
];

// 本地存儲或使用預設
let questionBank = JSON.parse(localStorage.getItem('yoga_quiz_db')) || defaultQuestionBank;

let currentQuiz = [];
let currentIndex = 0;
let userAnswers = [];

function showCard(id) {
    document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function showHome() { showCard('home-card'); }
function showEditor() { showCard('editor-card'); }

function startQuiz() {
    // 隨機抽 5 題（或全部題目）
    currentQuiz = [...questionBank].sort(() => 0.5 - Math.random()).slice(0, 5);
    currentIndex = 0;
    userAnswers = [];
    showCard('quiz-card');
    renderQuestion();
}

function renderQuestion() {
    let q = currentQuiz[currentIndex];
    document.getElementById('progress').style.width = `${((currentIndex + 1) / currentQuiz.length) * 100}%`;
    document.getElementById('category-badge').innerText = `[${q.category}] 第 ${currentIndex + 1} / ${currentQuiz.length} 題`;
    document.getElementById('question-text').innerText = q.question;
    
    let imgEl = document.getElementById('question-img');
    if (q.img) {
        imgEl.src = q.img;
        imgEl.style.display = 'block';
    } else {
        imgEl.style.display = 'none';
    }

    let optsContainer = document.getElementById('options-container');
    let inputEl = document.getElementById('short-answer-input');
    optsContainer.innerHTML = '';

    if (q.type === 'single') {
        inputEl.style.display = 'none';
        optsContainer.style.display = 'block';
        q.options.forEach((opt, i) => {
            let letter = String.fromCharCode(65 + i);
            let btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = `${letter}. ${opt}`;
            btn.onclick = () => {
                document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                userAnswers[currentIndex] = letter;
            };
            optsContainer.appendChild(btn);
        });
    } else {
        optsContainer.style.display = 'none';
        inputEl.style.display = 'block';
        inputEl.value = '';
        inputEl.oninput = (e) => { userAnswers[currentIndex] = e.target.value; };
    }
}

function nextQuestion() {
    if (!userAnswers[currentIndex]) {
        alert("請先回答或填寫選項喔！");
        return;
    }
    currentIndex++;
    if (currentIndex < currentQuiz.length) {
        renderQuestion();
    } else {
        calculateResult();
    }
}

function calculateResult() {
    let score = 0;
    let categoryStats = {};

    currentQuiz.forEach((q, i) => {
        if (!categoryStats[q.category]) categoryStats[q.category] = { correct: 0, total: 0 };
        categoryStats[q.category].total++;

        let isCorrect = false;
        if (q.type === 'single') {
            isCorrect = userAnswers[i] === q.answer;
        } else {
            // 簡答題關鍵字包含匹配
            isCorrect = userAnswers[i] && q.answer.split('、').every(k => userAnswers[i].includes(k.trim()));
        }

        if (isCorrect) {
            score += (100 / currentQuiz.length);
            categoryStats[q.category].correct++;
        }
    });

    // 顯示分數
    document.getElementById('score-text').innerText = `${Math.round(score)} 分`;

    // 強弱項標籤
    let tagsContainer = document.getElementById('analysis-tags');
    tagsContainer.innerHTML = '';
    for (let cat in categoryStats) {
        let rate = categoryStats[cat].correct / categoryStats[cat].total;
        let tag = document.createElement('span');
        tag.className = `tag ${rate >= 0.6 ? 'tag-strong' : 'tag-weak'}`;
        tag.innerText = `${cat} (${Math.round(rate * 100)}%)`;
        tagsContainer.appendChild(tag);
    }

    // 解析總覽
    let reviewContainer = document.getElementById('review-container');
    reviewContainer.innerHTML = '';
    currentQuiz.forEach((q, i) => {
        let div = document.createElement('div');
        div.className = 'analysis-item';
        div.innerHTML = `
            <strong>Q${i+1}. [${q.category}] ${q.question}</strong><br>
            你的回答：<span style="color:${userAnswers[i] === q.answer ? 'green':'red'}">${userAnswers[i] || '未答'}</span> | 
            正確答案：<b>${q.answer}</b><br>
            <small style="color:#555;">💡 解析：${q.explanation}</small>
        `;
        reviewContainer.appendChild(div);
    });

    showCard('result-card');
}

function toggleTypeEdit() {
    let type = document.getElementById('edit-type').value;
    document.getElementById('edit-options-group').style.display = type === 'single' ? 'block' : 'none';
}

function saveQuestion() {
    let cat = document.getElementById('edit-cat').value;
    let type = document.getElementById('edit-type').value;
    let qText = document.getElementById('edit-q').value;
    let img = document.getElementById('edit-img').value;
    let ans = document.getElementById('edit-ans').value;
    let exp = document.getElementById('edit-exp').value;

    if (!qText || !ans) { alert("請填寫題目與答案！"); return; }

    let opts = [];
    if (type === 'single') {
        document.querySelectorAll('.edit-opt').forEach(input => {
            if (input.value) opts.push(input.value);
        });
    }

    let newQ = {
        id: Date.now(),
        category: cat,
        type: type,
        question: qText,
        img: img,
        options: opts,
        answer: ans.toUpperCase(),
        explanation: exp
    };

    questionBank.push(newQ);
    localStorage.setItem('yoga_quiz_db', JSON.stringify(questionBank));
    alert("題目新增成功！");
    showHome();
}
</script>
</body>
</html>
