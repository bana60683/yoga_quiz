<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>瑜伽哲學模擬考 · RYT200</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF8F0;
    --bg-alt:#FFEDDC;
    --card:#FFFFFF;
    --primary:#E65100;
    --primary-light:#FF7043;
    --gold:#FFB300;
    --ink:#3E2313;
    --ink-soft:#8A6A54;
    --success:#2E7D32;
    --success-bg:#E9F5EA;
    --error:#C0392B;
    --error-bg:#FCEAE7;
    --line: rgba(230,81,0,0.14);
    --radius: 22px;
    --shadow: 0 14px 34px -18px rgba(160,70,10,0.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, #FFE3C4 0%, transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    padding: 20px 14px 60px;
  }
  .wrap{max-width:640px; margin:0 auto;}
  .sanskrit{font-family:'Cormorant Garamond', serif; font-style:italic; color:var(--primary);}
  h1,h2,h3{font-family:'Noto Serif TC', serif; margin:0;}
  a{color:inherit;}

  /* ---------- Header ---------- */
  .app-header{ text-align:center; padding: 14px 0 22px; }
  .app-header .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size:12.5px; letter-spacing:.14em; color:var(--primary);
    background:#FFF; border:1px solid var(--line); padding:5px 14px;
    border-radius:99px; margin-bottom:14px; font-weight:700;
  }
  .app-header .sun-mark{
    width:16px;height:16px;border-radius:50%;
    background:conic-gradient(from 0deg, var(--gold), var(--primary), var(--gold));
  }
  .app-header h1{font-size:26px; font-weight:900; color:var(--ink); line-height:1.4;}
  .app-header p{color:var(--ink-soft); font-size:14px; margin-top:8px;}

  /* ---------- Cards ---------- */
  .card{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    border:1px solid var(--line);
    padding:26px 22px;
    margin-bottom:16px;
  }

  /* ---------- Intro screen ---------- */
  .intro-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:20px 0;}
  .intro-stat{background:var(--bg-alt); border-radius:16px; padding:14px 8px; text-align:center;}
  .intro-stat b{display:block; font-size:22px; color:var(--primary); font-family:'Noto Serif TC',serif;}
  .intro-stat span{font-size:12px; color:var(--ink-soft);}
  .cat-chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px;}
  .chip{background:var(--bg-alt); color:var(--primary); font-size:12.5px; font-weight:700; padding:6px 12px; border-radius:99px;}

  .btn{
    display:block; width:100%; border:none; cursor:pointer;
    background:linear-gradient(135deg, var(--primary-light), var(--primary));
    color:#fff; font-weight:700; font-size:16px;
    padding:16px 20px; border-radius:16px;
    font-family:'Noto Sans TC',sans-serif;
    box-shadow:0 12px 24px -10px rgba(230,81,0,0.55);
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:scale(0.97); box-shadow:0 6px 14px -8px rgba(230,81,0,0.5);}
  .btn:disabled{ opacity:.45; box-shadow:none; cursor:not-allowed; }
  .btn.secondary{
    background:#fff; color:var(--primary); border:2px solid var(--primary-light);
    box-shadow:none;
  }
  .btn.small{padding:11px 16px; font-size:14px; width:auto; display:inline-block;}

  /* ---------- Mala progress ---------- */
  .mala{ display:flex; justify-content:center; gap:5px; flex-wrap:wrap; padding:4px 0 4px; }
  .bead{
    width:13px; height:13px; border-radius:50%;
    background:#F2DCC8; border:1.5px solid #EAC79D;
    transition: all .25s ease;
  }
  .bead.done{ background:linear-gradient(135deg,var(--gold),var(--primary)); border-color:var(--primary); }
  .bead.current{ background:#fff; border-color:var(--primary); box-shadow:0 0 0 4px rgba(230,81,0,0.15); transform:scale(1.2); }
  .progress-label{ text-align:center; font-size:12.5px; color:var(--ink-soft); margin-bottom:14px; letter-spacing:.05em;}

  /* ---------- Quiz question ---------- */
  .q-meta{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .q-cat{ font-size:11.5px; font-weight:700; color:var(--primary); background:var(--bg-alt); padding:4px 10px; border-radius:99px;}
  .q-num{ font-size:12px; color:var(--ink-soft); font-weight:700;}
  .q-text{ font-size:18px; line-height:1.65; font-weight:700; margin: 6px 0 20px; font-family:'Noto Serif TC',serif;}

  .options{ display:flex; flex-direction:column; gap:10px; }
  .option{
    text-align:left; background:var(--bg); border:2px solid var(--line);
    border-radius:16px; padding:14px 16px; font-size:15px; cursor:pointer;
    display:flex; align-items:center; gap:12px; transition: all .15s ease;
    font-family:'Noto Sans TC',sans-serif; color:var(--ink);
  }
  .option:active{ transform:scale(0.985); }
  .option .dot{ width:22px;height:22px;border-radius:50%; border:2px solid var(--primary-light); flex:0 0 auto; }
  .option.selected{ background:#FFF3E9; border-color:var(--primary); }
  .option.selected .dot{ background:var(--primary); border-color:var(--primary); }

  .fill-wrap{ margin-bottom:6px; }
  .fill-wrap label{ font-size:13px; color:var(--ink-soft); display:block; margin-bottom:8px;}
  .fill-input{
    width:100%; padding:16px; font-size:17px; border-radius:14px;
    border:2px solid var(--line); background:var(--bg);
    font-family:'Cormorant Garamond', serif; font-style:italic; color:var(--ink);
  }
  .fill-input:focus{ outline:none; border-color:var(--primary); background:#fff;}
  .fill-hint{ font-size:12px; color:var(--ink-soft); margin-top:8px;}

  .nav-row{ display:flex; gap:10px; margin-top:22px; }
  .nav-row .btn{ flex:1; }

  /* ---------- Results ---------- */
  .score-hero{ text-align:center; padding: 10px 0 6px;}
  .score-ring{
    width:150px; height:150px; border-radius:50%; margin:0 auto 14px;
    display:flex; align-items:center; justify-content:center;
    background: conic-gradient(var(--primary) calc(var(--pct,0)*1%), #F2DCC8 0);
    position:relative;
  }
  .score-ring::before{
    content:''; position:absolute; width:118px; height:118px; border-radius:50%; background:#fff;
  }
  .score-ring .val{ position:relative; font-family:'Noto Serif TC',serif; font-size:34px; font-weight:900; color:var(--primary);}
  .score-ring .val small{ display:block; font-size:12px; color:var(--ink-soft); font-weight:500;}
  .verdict{ font-size:17px; font-weight:700; margin-top:6px; font-family:'Noto Serif TC',serif;}
  .verdict-sub{ color:var(--ink-soft); font-size:13.5px; margin-top:6px; line-height:1.6;}

  .analysis-row{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .analysis-row .a-label{ width:110px; font-size:13px; font-weight:700; flex:0 0 auto;}
  .analysis-row .a-bar{ flex:1; height:10px; border-radius:99px; background:var(--bg-alt); overflow:hidden;}
  .analysis-row .a-fill{ height:100%; border-radius:99px; background:linear-gradient(90deg,var(--primary-light),var(--primary));}
  .analysis-row .a-pct{ width:38px; text-align:right; font-size:12.5px; font-weight:700; color:var(--primary); flex:0 0 auto;}

  .strength-box{ display:flex; gap:10px; margin-top:18px;}
  .strength-box .sb{ flex:1; border-radius:14px; padding:12px; font-size:13px;}
  .strength-box .good{ background:var(--success-bg); color:var(--success);}
  .strength-box .weak{ background:var(--error-bg); color:var(--error);}
  .strength-box b{ display:block; font-size:12px; margin-bottom:3px; opacity:0.75;}

  /* ---------- Review list ---------- */
  .review-item{ border-bottom:1px solid var(--line); padding: 16px 0;}
  .review-item:last-child{ border-bottom:none; }
  .review-head{ display:flex; gap:10px; align-items:flex-start;}
  .review-mark{ flex:0 0 auto; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:900; color:#fff; margin-top:2px;}
  .review-mark.correct{ background:var(--success); }
  .review-mark.wrong{ background:var(--error); }
  .review-q{ font-weight:700; font-size:15px; line-height:1.55; font-family:'Noto Serif TC',serif;}
  .review-body{ margin-left:36px; margin-top:8px; font-size:13.5px; }
  .review-line{ margin-bottom:5px; line-height:1.6;}
  .review-line .tag{ font-weight:700; margin-right:4px;}
  .review-line.your-wrong .val{ color:var(--error); text-decoration: line-through; text-decoration-color: rgba(192,57,43,0.5);}
  .review-line.correct-ans .val{ color:var(--success); font-weight:700;}
  .review-explain{ background:var(--bg-alt); border-radius:12px; padding:10px 12px; margin-top:8px; color:var(--ink-soft); line-height:1.6;}

  /* ---------- Modal (題庫瀏覽) ---------- */
  .modal-overlay{
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(62,35,19,0.5); z-index:1000;
    display:flex; justify-content:center; align-items:center; padding:16px;
    backdrop-filter: blur(4px);
  }
  .modal-content{
    background:#fff; border-radius:var(--radius);
    max-width:600px; width:100%; max-height:85vh;
    display:flex; flex-direction:column;
    box-shadow:0 20px 40px rgba(0,0,0,0.2);
    border:1px solid var(--line);
    overflow:hidden;
  }
  .modal-header{
    padding:18px 20px; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center;
    background:var(--bg);
  }
  .modal-header h2{ font-size:18px; font-weight:700; color:var(--ink); }
  .modal-close{
    background:none; border:none; font-size:22px; cursor:pointer;
    color:var(--ink-soft); font-weight:700; padding:0 8px;
  }
  .modal-body{
    padding:16px 20px; overflow-y:auto; flex:1;
  }
  .bank-item{
    padding:12px 0; border-bottom:1px solid var(--line);
  }
  .bank-item:last-child{ border-bottom:none; }
  .bank-q{ font-weight:700; font-size:14.5px; margin-bottom:6px; color:var(--ink); line-height:1.5;}
  .bank-ans{ font-size:13px; color:var(--success); font-weight:700; margin-bottom:4px;}
  .bank-ex{ font-size:12.5px; color:var(--ink-soft); background:var(--bg-alt); padding:8px 12px; border-radius:10px; margin-top:6px; line-height:1.5;}

  /* ---------- 體位法發音彈窗 ---------- */
  .now-playing-bar{ font-size:13px; font-weight:700; color:var(--primary); margin-bottom:8px; min-height:18px;}
  .asana-player-wrap{ margin-bottom:14px; }
  .asana-player-wrap audio{ width:100%; }
  .asana-quick-btns{ display:flex; gap:8px; margin-bottom:20px; }
  .asana-quick-btns .btn{ font-size:13px; padding:11px 14px; }

  .audio-group-title{ font-size:13px; font-weight:700; color:var(--primary); margin:18px 0 8px; display:flex; align-items:center; gap:6px;}
  .asana-list{ display:flex; flex-direction:column; gap:8px; }
  .asana-row{
    display:flex; align-items:center; gap:10px; padding:10px 12px;
    background:var(--bg-alt); border-radius:12px; cursor:pointer;
    border:1px solid transparent; transition: all .15s ease;
  }
  .asana-row:active{ transform:scale(0.98); }
  .asana-row.active{ background:linear-gradient(135deg, rgba(255,112,67,0.18), rgba(255,179,0,0.14)); border-color:var(--primary-light); }
  .asana-row.disabled{ opacity:.5; cursor:not-allowed; }
  .asana-row .no{ color:var(--ink-soft); font-weight:700; font-size:12px; width:22px; flex:0 0 auto; }
  .asana-row .names{ flex:1; min-width:0; }
  .asana-row .sk{ font-family:'Cormorant Garamond',serif; font-style:italic; color:var(--primary); font-weight:700; font-size:15px; line-height:1.3; }
  .asana-row .cn{ color:var(--ink-soft); font-size:12px; margin-top:2px; }
  .asana-row .play-ico{ color:var(--primary); font-size:12px; flex:0 0 auto; }
  .asana-row .mark-badge{
    display:none; font-size:11px; font-weight:700; color:#fff; background:var(--primary);
    padding:2px 8px; border-radius:99px; flex:0 0 auto;
  }
  .asana-note{ font-size:12.5px; color:var(--ink-soft); background:var(--bg-alt); padding:10px 12px; border-radius:10px; margin-top:14px; line-height:1.6; text-align:center;}

  .mark-tool{ margin-top:22px; padding-top:16px; border-top:1px dashed var(--line); }
  .mark-tool p{ font-size:12px; color:var(--ink-soft); line-height:1.6; }
  .mark-tool textarea{
    width:100%; min-height:130px; font-family:'SFMono-Regular',Consolas,monospace; font-size:11px;
    padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--bg); margin-top:10px; resize:vertical;
  }

  footer.note{ text-align:center; color:var(--ink-soft); font-size:11.5px; margin-top:24px; line-height:1.7;}

  @media (max-width:380px){
    .q-text{font-size:16.5px;}
    .score-ring{width:130px;height:130px;}
    .score-ring::before{width:100px;height:100px;}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ============================================================
   題庫資料 QUESTION BANK
   type: 'mc' (單選) | 'fill' (簡答)
   category: sankhya | sutra | hatha | mudra | chakra | nidra | asana
   ============================================================ */
const CATEGORY_LABEL = {
  sankhya:'數論哲學', sutra:'瑜伽經', hatha:'哈達瑜伽',
  mudra:'手印身印鎖印', chakra:'脈輪脈叢精微體', nidra:'舒眠瑜伽', asana:'體位法'
};

const MC_BANK = [
// ---------------- 數論哲學 sankhya ----------------
{cat:'sankhya', q:'數論哲學（Sankhya）的創始者是哪一位聖哲？', opts:['Kapil（卡皮拉）','Patanjali（帕坦伽利）','Swatmarama（斯瓦特拉瑪）','Vyasa（毗耶娑）'], a:0, ex:'數論哲學由聖哲 Kapil 所創立，是六大印度哲學派別之一。'},
{cat:'sankhya', q:'數論哲學為何被稱為「數論」？', opts:['與 21 個數字相關','與 25 個數字相關','與 7 個脈輪相關','與 8 個支分相關'], a:1, ex:'數論哲學建構出 25 個主題範疇，故稱數論。'},
{cat:'sankhya', q:'在數論哲學中，「Purusha」指的是？', opts:['物質世界的根本','永恆不變、純粹意識的靈／神我','向下分化的自我／我執','悅性所生的心智'], a:1, ex:'Purusha（靈／神我）是永恆不變的純粹意識，與物質性的 Prakriti 相對。'},
{cat:'sankhya', q:'「Prakriti」在數論哲學中代表？', opts:['純粹意識','物質世界演化的根本','五大元素之一','八支瑜伽的第一支'], a:1, ex:'Prakriti（原質）是物質世界的根本，誤認與 Purusha 結合後展開 25 個演化。'},
{cat:'sankhya', q:'「Ahankara」在數論演化體系中意指？', opts:['智力／Intellect','自我／我執／Ego','心智／Mind','原質／Prakriti'], a:1, ex:'Ahankara（自我／我執）由 Mahat 進一步分化而來，再向下分化出三性。'},
{cat:'sankhya', q:'「Mahat」在數論演化體系中意指？', opts:['智力／Intellect','自我／Ego','心智／Mind','靈／神我'], a:0, ex:'Mahat 意為智力，是 Prakriti 演化出的第一個層次。'},
{cat:'sankhya', q:'悅性（Sattva）分化出以下的什麼？', opts:['Ahankara（自我／我執）','Manas（心智／Mind）','Mahat（智力）','Prana（生命能量）'], a:1, ex:'悅性（Sattva）分化出 Manas（心智）、五感覺器官與五行動器官。'},
{cat:'sankhya', q:'以下何者屬於「五感覺器官」？', opts:['手、腳、嘴','眼、耳、鼻、舌、皮膚','空、風、火、水、土','視覺、聲、氣味、味覺、觸覺'], a:1, ex:'五感覺器官（Jnanendriyas）為眼、耳、鼻、舌、皮膚。'},
{cat:'sankhya', q:'以下何者「不屬於」五行動器官？', opts:['手','腳','眼','嘴'], a:2, ex:'五行動器官（Karmendriyas）為手、腳、嘴、排泄、生殖；眼屬於五感覺器官。'},
{cat:'sankhya', q:'惰性（Tamas）主要對應的是？', opts:['五感受與五大元素','五感覺器官','心智 Manas','自我 Ahankara'], a:0, ex:'惰性（Tamas）分化出五感受／感覺，以及空、風、火、水、土五大元素。'},
{cat:'sankhya', q:'變性（Rajas）的特性為何？', opts:['產生具體的感官器官','不產生實體，提供能量與驅動力','是純粹意識','是物質根本'], a:1, ex:'變性（Rajas）本身不產生實體，而是提供悅性與惰性演化所需的能量與驅動力。'},
{cat:'sankhya', q:'人生的五大煩惱（Kleshas）有無知、有我、執著、排斥與？', opts:['死懼','貪婪','憤怒','幻想'], a:0, ex:'五煩惱（Kleshas）為：無知、有我、執著、死懼、排斥。'},
{cat:'sankhya', q:'六大正統哲學派別中，著重實踐並以《瑜伽經》為核心的是？', opts:['Nyaya（正理論）','Yoga（瑜伽）','Vedanta（吠壇多）','Mimansa（彌曼差）'], a:1, ex:'Yoga 派由 Patanjali 創立，著重實踐端與《瑜伽經》。'},
{cat:'sankhya', q:'「Darshan」的意思是什麼？', opts:['意識傾聽','熱愛','帶著覺知去看見','宇宙意識能量'], a:2, ex:'「Darshan」（中文常譯為「達顯」）源自梵文，字面意思是「看見」或「注視」，帶著覺知去看見，也常用來代指印度哲學。'},
{cat:'sankhya', q:'以下何者屬於「非正統（Hetrodox）」印度哲學派別，即不依據《吠陀經》？', opts:['數論（Sankhya）','瑜伽（Yoga）','佛教(Buddha Dharma)','吠壇多（Vedanta）'], a:2, ex:'非正統派別不依《吠陀經》為本，包含佛教、耆那教與查瓦克（Charmwaka）。'},

// ---------------- 瑜伽經 sutra ----------------
{cat:'sutra', q:'帕坦伽利對「瑜伽」的核心定義為？', opts:['Chitta Vritti Nirodha（心緒轉止）','Ha Tha 平衡','Samskara 淨化','Ahimsa 非暴力'], a:0, ex:'《瑜伽經》核心定義瑜伽為「心緒轉止（Chitta Vritti Nirodha）」，心緒止息即達覺悟。'},
{cat:'sutra', q:'《瑜伽經》全書共有幾頌（Sutras）？', opts:['108 頌','196 頌','108 支','49 頌'], a:1, ex:'《瑜伽經》共有 196 頌，分為四大篇章。'},
{cat:'sutra', q:'《瑜伽經》第一篇的名稱為？', opts:['Samadhi Pada（三摩地篇）','Sadhana Pada（修煉篇）','Vibhuti Pada（神通篇）','Kaivalya Pada（解脫篇）'], a:0, ex:'第一篇為 Samadhi Pada（三摩地篇）。'},
{cat:'sutra', q:'《瑜伽經》第四篇、講述最終解脫的是？', opts:['Sadhana Pada','Vibhuti Pada','Kaivalya Pada（解脫篇）','Samadhi Pada'], a:2, ex:'Kaivalya Pada（解脫篇）為第四篇，講述最終的解脫獨存。'},
{cat:'sutra', q:'心緒止息的兩大方法為何？', opts:['Yama 與 Niyama','Abhyasa（持續練習）與 Vairagya（不執著）','Dharana 與 Dhyana','Ha 與 Tha'], a:1, ex:'心緒止息透過持續練習（Abhyasa）與不執著（Vairagya）達成。'},
{cat:'sutra', q:'以下何者「不屬於」造成痛苦心緒傾向的五種類別？', opts:['正確知識','錯誤知識','業力法則','記憶'], a:2, ex:'五種 Vrittis 為：正確知識、錯誤知識、幻想、記憶、睡眠；業力法則不在其中。'},
{cat:'sutra', q:'八支瑜伽（Ashtanga）的第一支為？', opts:['Niyama（精進）','Yama（持戒）','Asana（體位法）','Pratyahara（攝心）'], a:1, ex:'八支瑜伽依序為 Yama、Niyama、Asana、Pranayama、Pratyahara、Dharana、Dhyana、Samadhi。'},
{cat:'sutra', q:'Pratyahara（攝心／制感）常以什麼比喻其精神？', opts:['太陽升起','烏龜將頭腳收回殼內','河流匯入大海','種子發芽'], a:1, ex:'Pratyahara 意指將心智從外在感官收回，如烏龜將頭腳收回殼內，不向外放逸。'},
{cat:'sutra', q:'Dharana（凝神）的定義為？', opts:['把意識定錨在特定目標上','完全融為一體失去自我意識','不需費力持續定錨於目標','控制吸氣與呼氣的停頓'], a:0, ex:'Dharana 是把意識定錨在特定的目標上，是專注的初階練習。'},
{cat:'sutra', q:'Dhyana（入定／冥想）與 Dharana 最大的差異在於？', opts:['Dhyana 不需費力、持續穩定地定錨在目標上','Dhyana 是道德戒律','Dhyana 專指呼吸控制','Dhyana 只能在夜間練習'], a:0, ex:'Dharana 仍需刻意將心拉回目標，而 Dhyana 已能不費力地持續安住於目標。'},
{cat:'sutra', q:'Samadhi（三摩地）的定義為？', opts:['把意識定錨於目標','僅存在目標物，完全融為一體並失去自我意識','控制吸氣與呼氣的停頓','將心智從外在感官收回'], a:1, ex:'Samadhi 是八支瑜伽的最高境界，修行者與目標完全融合，失去對自我的覺察。'},
{cat:'sutra', q:'以下何者「不屬於」五持戒（Yama）？', opts:['Ahimsa（非暴力）','Satya（真實）','Santosha（知足）','Asteya（不偷盜）'], a:2, ex:'Santosha（知足）屬於五精進（Niyama），不屬於五持戒（Yama）。'},
{cat:'sutra', q:'精進（Niyama）中的「Tapas」意指？', opts:['清淨','苦行／熱情','知足','敬信神'], a:1, ex:'Tapas 意為苦行／熱情，是持續修行的內在燃燒力。'},
{cat:'sutra', q:'精進（Niyama）中的「Ishvara Pranidhana」的意思為？', opts:['自我研讀聖典','敬信神／安住於至上','清淨身心','不貪婪'], a:1, ex:'Ishvara Pranidhana 是五精進之一，意為敬信神、順應宇宙的臣服，安住於至上。'},
{cat:'sutra', q:'持戒（yama）中的「Aparigraha」的意思為？', opts:['清淨','不貪婪','苦行','自我研讀'], a:1, ex:'Aparigraha 是五持戒之一，意為不貪婪、不過度囤積。'},
{cat:'sutra', q:'精進（Niyama）中「Svadhyaya」的意思為？', opts:['自我研讀／聖典研習','清淨','知足','敬信神'], a:0, ex:'Svadhyaya 屬五精進之一，意為自我研讀與聖典研習。'},
{cat:'sutra', q:'「Asana」在八支瑜伽中的定義為？', opts:['道德戒律','穩定且舒適的姿勢','控制呼吸的停頓','把心智從感官收回'], a:1, ex:'Asana（體位法）在《瑜伽經》中被定義為穩定且舒適的姿勢。'},

// ---------------- 哈達瑜伽／調息淨化 hatha ----------------
{cat:'hatha', q:'《哈達瑜伽經》的作者是哪位聖哲？', opts:['Patanjali','Kapil','Swatmarama（斯瓦特拉瑪）','Vyasa'], a:2, ex:'《哈達瑜伽經》由聖哲 Swatmarama 所著。'},
{cat:'hatha', q:'「Ha」在哈達瑜伽中代表？', opts:['月／陰／左鼻孔','日／陽／右鼻孔／太陽脈 Pingala','中脈 Sushumna','心智之流'], a:1, ex:'Ha 代表日、陽、右鼻孔與太陽脈（Pingala Nadi）。'},
{cat:'hatha', q:'「Tha」在哈達瑜伽中代表？', opts:['日／陽／右鼻孔','月／陰／左鼻孔／月亮脈 Ida','中脈 Sushumna','火之元素'], a:1, ex:'Tha 代表月、陰、左鼻孔與月亮脈（Ida Nadi）。'},
{cat:'hatha', q:'根據《哈達瑜伽經》中所述，哈達瑜伽的目的是什麼？', opts:['獲得知識','獲得永生','達到勝王瑜伽','無特定目的'], a:2, ex:'根據《哈達瑜伽經》所述，哈達瑜伽的最終目的是作為通往「勝王瑜伽」（Raja Yoga）的階梯與唯一途徑。它透過身體的淨化、體位法與呼吸控制，創造身心平衡，進而喚醒拙火（Kundalini），最終達到靈性解脫的最高境界。'},
{cat:'hatha', q:'哈達瑜伽與帕坦伽利瑜伽經最大的差異在於？', opts:['哈達瑜伽透過控制身體與呼吸來進一步控制心智','哈達瑜伽只重視冥想不重視體位法','瑜伽經著重外在戒律而非心智','兩者完全相同並無差異'], a:0, ex:'瑜伽經著重由高至低直接控制心智；哈達瑜伽則透過身體淨化、體位法與呼吸控制心智。'},
{cat:'hatha', q:'以下何者「不屬於」六大淨化法（Shatkarma）？', opts:['Neti（洗鼻法）','Trataka（凝視法）','Bhastrika（風箱呼吸法）','Nauli（腹部按摩法）'], a:2, ex:'Bhastrika 屬於調息法（Pranayama），並非六大淨化法之一。'},
{cat:'hatha', q:'「Neti」淨化法指的是？', opts:['洗鼻法','灌腸法','腹部按摩法','凝視法'], a:0, ex:'Neti 是清潔鼻腔通道的洗鼻法。'},
{cat:'hatha', q:'「Trataka」淨化法指的是？', opts:['前額葉淨化法','凝視法','灌腸法','內部淨化法'], a:1, ex:'Trataka 是專注凝視特定目標（如燭光）以淨化心智的凝視法。'},
{cat:'hatha', q:'「Kapalbhati」淨化法指的是？', opts:['腹部按摩法','洗鼻法','前額葉淨化法','灌腸法'], a:2, ex:'Kapalbhati 意為前額葉淨化法，透過呼吸淨化頭腦。'},
{cat:'hatha', q:'「Nauli」淨化法指的是？', opts:['腹部按摩法','灌腸法','凝視法','內部淨化法'], a:0, ex:'Nauli 是透過腹部肌肉滾動按摩內臟的淨化法。'},
{cat:'hatha', q:'「Dhauti」淨化法指的是？', opts:['內部淨化法','灌腸法','洗鼻法','凝視法'], a:0, ex:'Dhauti 泛指清潔消化道的內部淨化法。'},
{cat:'hatha', q:'「Basti」淨化法指的是？', opts:['內部淨化法','灌腸法','洗鼻法','凝視法'], a:1, ex:'Basti（灌腸法）利用水或其他方式清潔肛門、大腸。'},

{cat:'hatha', q:'利用水或其他方式清潔肛門、大腸的淨化法是？', opts:['Nauli','Basti','Dhauti','Kapalbhati'], a:1, ex:'Basti（灌腸法）利用水或其他方式清潔肛門、大腸。'},

{cat:'hatha', q:'Ujjayi Pranayama 又稱為？', opts:['勝利呼吸法','風箱呼吸法','清涼呼吸法','蜜蜂呼吸法'], a:0, ex:'Ujjayi（勝利呼吸法）能增加體內熱能、清理呼吸道並幫助保持覺知。'},
{cat:'hatha', q:'Bhastrika Pranayama（風箱呼吸法）的禁忌對象「不包含」以下何者？', opts:['高血壓、心臟病患者','癲癇、青光眼患者','懷孕期間、近期腹部手術者','輕微感冒的一般健康成人'], a:3, ex:'風箱呼吸法對高血壓、心臟病、癲癇、青光眼、胃潰瘍、懷孕及術後者皆屬嚴禁對象，一般健康成人非其列。'},

{cat:'hatha', q:'哪一種調息法特別能舒緩憤怒與焦慮，並有助降溫？', opts:['Bhastrika Pranayama','Sheetali／Seetkari Pranayama','Ujjayi Pranayama','Bhramari Pranayama'], a:1, ex:'清涼呼吸法（Sheetali／Seetkari）能降低體溫血壓，舒緩憤怒與焦慮。'},

{cat:'mudra', q:'Nasikagra Drishti Mudra 的凝視焦點為？', opts:['眉心','鼻尖','心輪','天空'], a:1, ex:'Nasikagra Drishti Mudra 是專注凝視鼻尖的身印。'},
{cat:'mudra', q:'Khechari Mudra 是指？', opts:['鎖舌身印','關七竅身印','馬身印','倒轉身印'], a:0, ex:'Khechari Mudra 為鎖舌身印，屬於頭部身印之一。'},

{cat:'mudra', q:'什麼情況下不要練習 Vajroli／Sahajoli Mudra （閃電身印/自發身印）？', opts:['心臟病、高血壓患者','尿道炎','憂鬱症','2~3個月內有進行眼部手術'], a:1, ex:'Vajroli／Sahajoli Mudra （閃電身印/自發身印）是透過收縮生殖泌尿系統與骨盆底肌肉來調節能量。若泌尿道感染發炎，切勿勉強練習。'},
{cat:'mudra', q:'Jalandhara Bandha 指的是哪一種鎖印？', opts:['喉輪鎖印','臍輪鎖印／腹鎖','海底輪鎖印／根鎖','大鎖印'], a:0, ex:'Jalandhara Bandha 為喉輪鎖印（Throat Lock）。'},
{cat:'mudra', q:'Uddiyana Bandha 指的是哪一種鎖印？', opts:['喉輪鎖印','臍輪鎖印／腹鎖','海底輪鎖印／根鎖','大鎖印'], a:1, ex:'Uddiyana Bandha 為臍輪鎖印，即腹鎖（Abdominal Lock）。'},
{cat:'mudra', q:'Moola Bandha 指的是哪一種鎖印？', opts:['喉輪鎖印','臍輪鎖印','海底輪鎖印／根鎖','大鎖印'], a:2, ex:'Moola Bandha 為海底輪鎖印，即根鎖（Root Lock）。'},
{cat:'mudra', q:'Maha Bandha（大鎖印）的定義為？', opts:['僅指喉輪鎖印','僅指腹鎖','同時結合喉輪、臍輪與海底輪三個鎖印','是一種手印而非鎖印'], a:2, ex:'Maha Bandha（大鎖印）同時結合 Jalandhara、Uddiyana 與 Moola 三個鎖印。'},
{cat:'mudra', q:'練習大鎖印時的順序為何？', opts:['Jalandhara Bandha→Uddiyana Bandha→Moola Bandha','Uddiyana Bandha→Jalandhara Bandha→Moola Bandha','Moola Bandha→Uddiyana Bandha→Jalandhara Bandha','Jalandhara Bandha→Moola Bandha→Uddiyana Bandha'], a:0, ex:'進入大鎖印（Maha Bandha）時需完全呼氣並配合外止息後進行三個鎖印(Bandha)，順序依序為喉鎖（Jalandhara Bandha）、臍鎖（Uddiyana Bandha）、根鎖（Mula Bandha）。'},

/* ============================================================

   ============================================================ */
const TOTAL_MC = 17, TOTAL_FILL = 3;
let state = { screen:'intro', questions:[], current:0, answers:[], showBankModal: false, showAsanaModal: false };

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function normalize(s){ return (s||'').toLowerCase().replace(/\s+/g,' ').trim(); }
function normalizeNoSpace(s){ return normalize(s).replace(/\s+/g,''); }

function buildQuiz(){
  const mcPicks = shuffle(MC_BANK).slice(0, TOTAL_MC).map(q=>({...q, type:'mc'}));
  const fillPicks = shuffle(FILL_BANK).slice(0, TOTAL_FILL).map(q=>({...q, type:'fill', cat:'asana'}));
  const all = [...mcPicks, ...fillPicks];
  state.questions = all;
  state.current = 0;
  state.answers = new Array(all.length).fill(null);
  state.screen = 'quiz';
  render();
}

function selectMC(optIdx){
  state.answers[state.current] = optIdx;
  render();
}
function typeFill(val){
  state.answers[state.current] = val;
}
function goNext(){
  if(state.current < state.questions.length-1){ state.current++; render(); }
  else { state.screen='result'; render(); }
}
function goPrev(){
  if(state.current>0){ state.current--; render(); }
}
function restart(){ state.screen='intro'; render(); }

function toggleBankModal(show){
  state.showBankModal = show;
  render();
}

function toggleAsanaModal(show){
  state.showAsanaModal = show;
  render();
}

function isCorrect(q, ans){
  if(ans===null || ans===undefined || ans==='') return false;
  if(q.type==='mc') return ans === q.a;
  const na = normalize(ans), nna = normalizeNoSpace(ans);
  return q.a.some(valid => normalize(valid) === na || normalizeNoSpace(valid) === nna);
}

function renderHeader(){
  return `
    <header class="app-header">
      <div class="eyebrow"><span class="sun-mark"></span> RYT200 YOGA PHILOSOPHY</div>
      <h1>瑜伽哲學模擬考</h1>
      <p>涵蓋數論、瑜伽經、哈達、脈輪精微體與體位法拼音</p>

  `;
}

📝 本測驗題目以瑜伽哲學課本內容為基礎，由 AI 整理後，再經人工檢視最佳化後出題；每次測驗皆會<strong>隨機抽取題目</strong>。<br><br>

🔒 <strong>測驗資料不會儲存於任何地方，也不會有後台查看或紀錄您的測驗成績</strong>，僅供個人學習與練習使用，請放心作答。<br><br>

如果遇到題目敘述不清楚、答案有疑慮，或覺得題目好像怪怪的，也歡迎提出來，方便後續修正與維護題庫。<br><br>

祝您學習順利，測驗愉快！📒😄

function renderQuiz(){
  const q = state.questions[state.current];
  const ans = state.answers[state.current];
  const total = state.questions.length;

  const beads = state.questions.map((_, i) => {
    let cls = 'bead';
    if(i === state.current) cls += ' current';
    else if(state.answers[i] !== null && state.answers[i] !== '') cls += ' done';
    return `<div class="${cls}"></div>`;
  }).join('');

  let inputHtml = '';
  if(q.type === 'mc'){
    inputHtml = `<div class="options">
      ${q.opts.map((opt, i) => `
        <div class="option ${ans === i ? 'selected' : ''}" onclick="selectMC(${i})">
          <div class="dot"></div>
          <div>${opt}</div>
        </div>
      `).join('')}
    </div>`;
  } else {
    inputHtml = `
      <div class="fill-wrap">
        <label>請輸入羅馬拼音（不需區分大小寫）：</label>
        <input type="text" class="fill-input" placeholder="例如: Tadasana" value="${ans || ''}" oninput="typeFill(this.value)">
        <div class="fill-hint">提示：拼音之間可留空格，如 adho mukha svanasana</div>
      </div>
    `;
  }

  return `
    ${renderHeader()}
    <div class="card">
      <div class="mala">${beads}</div>
      <div class="progress-label">第 ${state.current + 1} / ${total} 題</div>
      
      <div class="q-meta">
        <span class="q-cat">${CATEGORY_LABEL[q.cat] || '綜合'}</span>
        <span class="q-num">${q.type==='mc' ? '單選題' : '拼音填空題'}</span>
      </div>
      <div class="q-text">${q.q}</div>

      ${inputHtml}

      <div class="nav-row">
        <button class="btn secondary" onclick="goPrev()" ${state.current===0?'disabled':''}>上一題</button>
        <button class="btn" onclick="goNext()">${state.current===total-1 ? '完成交卷' : '下一題'}</button>
      </div>
    </div>
  `;
}

function renderResult(){
  let correctCount = 0;
  const catStats = {};

  state.questions.forEach((q, i) => {
    const ok = isCorrect(q, state.answers[i]);
    if(ok) correctCount++;

    if(!catStats[q.cat]) catStats[q.cat] = { total:0, correct:0 };
    catStats[q.cat].total++;
    if(ok) catStats[q.cat].correct++;
  });

  const score = Math.round((correctCount / state.questions.length) * 100);
  let verdict = '', verdictSub = '';
  if(score >= 90){
    verdict = ' Namaste！你是 Ashish 老師嗎？';
    verdictSub = '恭喜！您對瑜伽哲學與體位法梵文有極深刻的理解，絕對能在考試中取得優異成績！';
  } else if(score >= 70){
    verdict = ' 相當優秀！持續穩健練習';
    verdictSub = '您已經掌握了大部份的瑜伽哲學概念，稍微複習弱點章節就能更加完美。';
  } else {
    verdict = ' Abhyasa！持續練習與精進';
    verdictSub = '瑜伽哲學是深厚的學問，可以多閱讀幾次講義，並多瀏覽下方錯題解析來補強記憶喔。';
  }

  const reviewHtml = state.questions.map((q, i) => {
    const userAns = state.answers[i];
    const ok = isCorrect(q, userAns);

    let yourAnsText = '', correctAnsText = '';
    if(q.type === 'mc'){
      yourAnsText = userAns !== null ? q.opts[userAns] : '未作答';
      correctAnsText = q.opts[q.a];
    } else {
      yourAnsText = userAns || '未作答';
      correctAnsText = q.a.join(' / ');
    }

    return `
      <div class="review-item">
        <div class="review-head">
          <div class="review-mark ${ok?'correct':'wrong'}">${ok?'✓':'✕'}</div>
          <div>
            <div style="font-size:11.5px; color:var(--primary); font-weight:700;">[${CATEGORY_LABEL[q.cat]}] 第 ${i+1} 題</div>
            <div class="review-q">${q.q}</div>
          </div>
        </div>
        <div class="review-body">
          ${!ok ? `<div class="review-line your-wrong"><span class="tag">您的回答：</span><span class="val">${yourAnsText}</span></div>` : ''}
          <div class="review-line correct-ans"><span class="tag">正確答案：</span><span class="val">${correctAnsText}</span></div>
          <div class="review-explain"><b>解析：</b>${q.ex}</div>
        </div>
      </div>
    `;
  }).join('');

  return `
    ${renderHeader()}
    <div class="card">
      <div class="score-hero">
        <div class="score-ring" style="--pct:${score}">
          <div class="val">${score}<small>分</small></div>
        </div>
        <div class="verdict">${verdict}</div>
        <div class="verdict-sub">${verdictSub}</div>
      </div>

      <div style="margin:24px 0 16px;">
        <h3 style="font-size:16px; margin-bottom:12px;">各章節分析</h3>
        ${Object.keys(catStats).map(cat => {
          const s = catStats[cat];
          const pct = Math.round((s.correct / s.total) * 100);
          return `
            <div class="analysis-row">
              <div class="a-label">${CATEGORY_LABEL[cat]}</div>
              <div class="a-bar"><div class="a-fill" style="width:${pct}%"></div></div>
              <div class="a-pct">${pct}%</div>
            </div>
          `;
        }).join('')}
      </div>

      <button class="btn" onclick="restart()">重新測驗</button>
    </div>

    <div class="card">
      <h3 style="font-size:18px; margin-bottom:16px;">測驗檢討與解析</h3>
      ${reviewHtml}
    </div>
  `;
}

function renderBankModal(){
  if(!state.showBankModal) return '';

  const mcItems = MC_BANK.map((q, i) => `
    <div class="bank-item">
      <div class="bank-q">${i+1}. [${CATEGORY_LABEL[q.cat]}] ${q.q}</div>
      <div class="bank-ans">正解：${q.opts[q.a]}</div>
      <div class="bank-ex">${q.ex}</div>

        </div>
        <div class="modal-body">
          <h3 style="color:var(--primary); margin-bottom:10px;">單選題庫 (${MC_BANK.length} 題)</h3>
          ${mcItems}
          <h3 style="color:var(--primary); margin:20px 0 10px;">體位法簡答題庫 (${FILL_BANK.length} 題)</h3>
          ${fillItems}
        </div>
      </div>
    </div>
  `;
}

let asanaMarks = {};   // { [no]: 秒數 }，暫存本次標記結果（重新整理頁面後會清空）

function formatTime(sec){
  sec = Math.max(0, Math.floor(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return m + ':' + String(s).padStart(2,'0');
}

function updateNowPlayingLabel(text){
  const el = document.getElementById('nowPlayingLabel');
  if(el) el.textContent = '🎵 正在播放：' + text;
}

function setActiveRow(no){
  document.querySelectorAll('.asana-row').forEach(r=>r.classList.remove('active'));
  const row = document.querySelector(`.asana-row[data-no="${no}"]`);
  if(row) row.classList.add('active');
}

function playAsanaFull(fileNum){
  const file = fileNum === 1 ? AUDIO_FILE_1 : AUDIO_FILE_2;
  const player = document.getElementById('asanaPlayer');
  if(!player) return;
  if(!player.src.endsWith(file)) player.src = file;
  player.currentTime = 0;
  player.play();
  updateNowPlayingLabel(fileNum === 1 ? '錄音一（從頭播放）' : '錄音二（從頭播放）');
  document.querySelectorAll('.asana-row').forEach(r=>r.classList.remove('active'));
}

function handleAsanaClick(no){
  const item = ASANA_LIST.find(a => a.no === no);
  if(!item || !item.file) return;
  const player = document.getElementById('asanaPlayer');
  if(!player) return;

  if(markMode){
    // 標記模式：只記錄目前播放進度，不會跳轉／中斷播放
    if(!player.src.endsWith(item.file)){
      alert('請先播放「' + (item.file === AUDIO_FILE_1 ? '錄音一' : '錄音二') + '」，再於播放過程中點選體位法進行標記。');
      return;
    }
    asanaMarks[no] = Math.round(player.currentTime * 10) / 10;
    const badge = document.querySelector(`.asana-row[data-no="${no}"] .mark-badge`);
    if(badge) badge.textContent = formatTime(asanaMarks[no]);
    return;
  }

  // 一般模式：跳轉到該體位法的時間點並播放
  if(!player.src.endsWith(item.file)) player.src = item.file;
  player.currentTime = item.start || 0;
  player.play();
  updateNowPlayingLabel(item.sk + '（' + item.cn + '）');
  setActiveRow(no);

  clearTimeout(player._stopTimer);
  if(item.duration && item.duration > 0){
    player._stopTimer = setTimeout(()=>{ player.pause(); }, item.duration * 1000);
  }
}

function toggleMarkMode(){
  markMode = !markMode;
  const btn = document.getElementById('markModeBtn');
  const panel = document.getElementById('markOutputPanel');
  if(btn) btn.textContent = markMode
    ? '✅ 標記模式：開啟中（點體位法＝標記時間；再按一次結束）'
    : '🛠️ 開啟時間點標記工具（給老師／管理員使用）';
  if(panel) panel.style.display = markMode ? 'block' : 'none';
  document.querySelectorAll('.mark-badge').forEach(b => {
    b.style.display = markMode ? 'inline-block' : 'none';
  });
}

function generateTimestampCode(){
  const lines = ASANA_LIST.map(item=>{
    const start = asanaMarks[item.no] !== undefined ? asanaMarks[item.no] : (item.start || 0);
    const fileVar = item.file === AUDIO_FILE_1 ? 'AUDIO_FILE_1' : (item.file === AUDIO_FILE_2 ? 'AUDIO_FILE_2' : 'null');
    return `  {no:${item.no}, sk:'${item.sk}', cn:'${item.cn}', file:${fileVar}, start:${start}, duration:0},`;
  });
  const code = 'const ASANA_LIST = [\n' + lines.join('\n') + '\n];';
  const out = document.getElementById('markOutputCode');
  if(out) out.value = code;
}

function render(){
  const app = document.getElementById('app');
  let content = '';

  if(state.screen === 'intro') content = renderIntro();
  else if(state.screen === 'quiz') content = renderQuiz();
  else if(state.screen === 'result') content = renderResult();

  app.innerHTML = content + renderBankModal() + renderAsanaModal() + `<footer class="note">Made by 8ana for 2026 Yoga Teacher Training · Philosophy Practice</footer>`;
}

// 首次啟動繪製畫面
render();
</script>
</body>
</html>
